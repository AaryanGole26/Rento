{% extends 'store/auth_base.html' %}

{% block title %}Log In | Rento{% endblock %}

{% block card %}
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <h1>Login Here</h1>

  {% include 'store/_auth_messages.html' %}

  <label for="username">Username or Email</label>
  <input class="form-control" type="text" placeholder="Enter username or email" id="username" name="username" autocomplete="username" required>

  <label for="password">Password</label>
  <input class="form-control" type="password" placeholder="Password" id="password" name="pass" autocomplete="current-password" required>

  <button type="submit" class="btn btn-brand">Log In</button>

  <div class="auth-links">
    <a href="{% url 'signup' %}">Create an account</a>
    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
  </div>
</form>
{% endblock card %}
