{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2a47">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  try {
    if (!document.documentElement.hasAttribute('data-lock-theme') && localStorage.getItem('rento-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (error) {}
</script>
<link rel="preload" href="{% static 'fonts/manrope.woff2' %}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{% static 'css/main.css' %}">
