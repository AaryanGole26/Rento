{% extends 'store/auth_base.html' %}

{% block title %}Sign Up | Rento{% endblock %}

{% block card %}
<form method="post">
  {% csrf_token %}
  <h1>Signup Here</h1>

  {% include 'store/_auth_messages.html' %}

  <label for="username">Username</label>
  <input class="form-control" type="text" placeholder="Username" name="username" id="username" value="{{ username|default:'' }}" autocomplete="username" required>

  <label for="email">Email</label>
  <input class="form-control" type="email" placeholder="Email" name="email" id="email" value="{{ email|default:'' }}" autocomplete="email" required>

  <label for="password1">Password</label>
  <input class="form-control" type="password" placeholder="Password" id="password1" name="password1" autocomplete="new-password" required>

  <label for="password2">Confirm Password</label>
  <input class="form-control" type="password" placeholder="Confirm Password" id="password2" name="password2" autocomplete="new-password" required>

  <button type="submit" class="btn btn-brand">Signup</button>

  <div class="auth-links">
    <a href="{% url 'login' %}">Already have an account? Log in</a>
  </div>
</form>
{% endblock card %}
