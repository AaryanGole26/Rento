<div style="background-color: #0f2a47; padding: 32px 16px; font-family: Arial, sans-serif;">
  <div style="max-width: 480px; margin: 0 auto; padding: 32px; background-color: #ffffff; border: 1px solid #e2e0d8; border-radius: 14px; color: #14181f;">
    <h1 style="margin: 0 0 16px; font-size: 22px; color: #14181f;">Reset your password</h1>
    <p style="margin: 0 0 12px; color: #14181f;">Hi {{ user.get_username }},</p>
    <p style="margin: 0 0 24px; color: #59616e;">We received a request to reset the password for your Rento account.</p>
    <p style="margin: 0 0 24px;">
      <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display: inline-block; padding: 12px 24px; background-color: #ffc400; border-radius: 8px; color: #14181f; font-weight: 600; text-decoration: none;">Choose a new password</a>
    </p>
    <p style="margin: 0; color: #59616e; font-size: 13px;">The link works once and expires in one hour. If you didn't ask for this, you can ignore this email and your password will stay the same.</p>
  </div>
</div>
